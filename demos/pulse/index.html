<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulse Dashboard — AITCH Demo</title>
<style>
:root{--ink:#0B0D12;--s:#141821;--l:#232A36;--v:#C6F432;--t:#EEF1F6;--m:#8A93A6;--sg:#7C5CFF}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--ink);color:var(--t);font:14px/1.5 Inter,system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--l)}header b{font-size:18px}
.badge{border:1px dashed var(--sg);color:#b7a8ff;font-size:11px;padding:2px 8px;border-radius:6px}
.ctl{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}select,label.btn{font:inherit;background:var(--s);color:var(--t);border:1px solid var(--l);border-radius:8px;padding:7px 12px;cursor:pointer}
main{padding:18px;display:grid;gap:14px}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.card{background:var(--s);border:1px solid var(--l);border-radius:14px;padding:16px}.kpi small{color:var(--m)}.kpi b{display:block;font-size:26px}
.up{color:var(--v);font-size:12px}.dn{color:#ff6b6b;font-size:12px}
.two{display:grid;grid-template-columns:2fr 1fr;gap:14px}@media(max-width:820px){.two{grid-template-columns:1fr}}
canvas{width:100%;height:260px;display:block}h3{font-size:14px;color:var(--m);font-weight:500;margin-bottom:10px}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--l);text-align:left}th{color:var(--m);font-weight:500}td.n{text-align:right}
.bar{height:6px;background:var(--l);border-radius:3px;margin-top:4px}.bar i{display:block;height:100%;background:var(--v);border-radius:3px}
#tip{position:fixed;pointer-events:none;background:#000;border:1px solid var(--l);padding:6px 10px;border-radius:8px;font-size:12px;display:none}
</style></head><body>
<header><b>Pulse</b><span class="badge">AITCH DEMO · generated sample data</span>
<div class="ctl"><select id="range"><option value="30">Last 30 days</option><option value="90" selected>Last 90 days</option><option value="365">Last 12 months</option></select>
<select id="chan"><option value="">All channels</option></select>
<label class="btn">Import CSV<input type="file" id="csv" accept=".csv" hidden></label></div></header>
<main><div class="kpis" id="kpis"></div>
<div class="two"><div class="card"><h3>Revenue per day</h3><canvas id="line"></canvas></div><div class="card"><h3>Revenue by channel</h3><div id="chans"></div></div></div>
<div class="card"><h3>Top products</h3><table><thead><tr><th>Product</th><th class="n">Orders</th><th class="n">Revenue</th></tr></thead><tbody id="top"></tbody></table>
<p style="color:var(--m);font-size:12px;margin-top:10px">CSV format: date,channel,product,amount (one order per row).</p></div></main><div id="tip"></div>
<script>
const $=id=>document.getElementById(id),f=n=>'$'+Math.round(n).toLocaleString();
function gen(){let r=[],seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;const ch=["Online store","Retail","Wholesale","Marketplace"],pr=["Classic Tee","Hoodie","Cap","Tote Bag","Sneakers","Water Bottle"],price=[24,55,18,15,89,22];const now=new Date();now.setHours(0,0,0,0);
for(let d=729;d>=0;d--){const day=new Date(now-d*864e5),trend=1+(729-d)/900,wk=[.7,1,1,1.05,1.1,1.3,1.2][day.getDay()];const n=Math.round((8+rnd()*10)*trend*wk);for(let i=0;i<n;i++){const p=Math.floor(rnd()*pr.length),c=rnd()<.5?0:rnd()<.6?1:rnd()<.5?2:3;r.push({date:day,channel:ch[c],product:pr[p],amount:price[p]*(1+Math.floor(rnd()*3))})}}return r}
let data=gen();
function chanOpts(){const s=$('chan'),v=s.value;s.innerHTML='<option value="">All channels</option>'+[...new Set(data.map(r=>r.channel))].map(c=>`<option>${c}</option>`).join('');s.value=v}
function slice(off){const days=+$('range').value,c=$('chan').value,max=Math.max(...data.map(r=>+r.date)),end=max-off*days*864e5,start=end-days*864e5;return data.filter(r=>+r.date>start&&+r.date<=end&&(!c||r.channel===c))}
function render(){const cur=slice(0),prev=slice(1),sum=a=>a.reduce((s,r)=>s+r.amount,0);const R=sum(cur),P=sum(prev),O=cur.length,PO=prev.length,cust=Math.round(O*.72);
const d=(a,b)=>{if(!b)return'';const p=(a-b)/b*100;return`<span class="${p>=0?'up':'dn'}">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(1)}% vs prior</span>`};
$('kpis').innerHTML=[['Revenue',f(R),d(R,P)],['Orders',O.toLocaleString(),d(O,PO)],['Avg order value',f(O?R/O:0),d(O?R/O:0,PO?P/PO:0)],['Est. customers',cust.toLocaleString(),d(cust,PO*.72)]].map(([a,b,c])=>`<div class="card kpi"><small>${a}</small><b>${b}</b>${c}</div>`).join('');
const byC={};cur.forEach(r=>byC[r.channel]=(byC[r.channel]||0)+r.amount);const mc=Math.max(1,...Object.values(byC));
$('chans').innerHTML=Object.entries(byC).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between"><span>${k}</span><span>${f(v)}</span></div><div class="bar"><i style="width:${v/mc*100}%"></i></div></div>`).join('');
const byP={};cur.forEach(r=>{const p=byP[r.product]||={o:0,v:0};p.o++;p.v+=r.amount});
$('top').innerHTML=Object.entries(byP).sort((a,b)=>b[1].v-a[1].v).slice(0,6).map(([k,p])=>`<tr><td>${k}</td><td class="n">${p.o}</td><td class="n">${f(p.v)}</td></tr>`).join('');
const byD={};cur.forEach(r=>{const k=r.date.toISOString().slice(0,10);byD[k]=(byD[k]||0)+r.amount});draw(Object.entries(byD).sort())}
let pts=[];
function draw(series){const c=$('line'),dpr=devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;const g=c.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,W,H);if(!series.length)return;
const pad=34,max=Math.max(...series.map(s=>s[1]))*1.1,x=i=>pad+i*(W-pad-8)/Math.max(1,series.length-1),y=v=>H-20-v/max*(H-36);
g.strokeStyle='#232A36';g.fillStyle='#8A93A6';g.font='11px Inter,sans-serif';for(let i=0;i<=3;i++){const v=max*i/3,yy=y(v);g.beginPath();g.moveTo(pad,yy);g.lineTo(W,yy);g.stroke();g.fillText(v>=1000?Math.round(v/1000)+'k':Math.round(v),2,yy+4)}
const grd=g.createLinearGradient(0,0,0,H);grd.addColorStop(0,'rgba(198,244,50,.25)');grd.addColorStop(1,'rgba(198,244,50,0)');
g.beginPath();series.forEach((s,i)=>i?g.lineTo(x(i),y(s[1])):g.moveTo(x(i),y(s[1])));g.lineTo(x(series.length-1),H-20);g.lineTo(x(0),H-20);g.fillStyle=grd;g.fill();
g.beginPath();series.forEach((s,i)=>i?g.lineTo(x(i),y(s[1])):g.moveTo(x(i),y(s[1])));g.strokeStyle='#C6F432';g.lineWidth=2;g.stroke();pts=series.map((s,i)=>[x(i),s])}
$('line').onmousemove=e=>{const r=e.target.getBoundingClientRect(),mx=e.clientX-r.left;let b=null,bd=1e9;pts.forEach(p=>{const d=Math.abs(p[0]-mx);if(d<bd){bd=d;b=p}});if(!b)return;const t=$('tip');t.style.display='block';t.style.left=e.clientX+12+'px';t.style.top=e.clientY-30+'px';t.textContent=b[1][0]+' · '+f(b[1][1])};
$('line').onmouseleave=()=>$('tip').style.display='none';
$('csv').onchange=e=>{const file=e.target.files[0];if(!file)return;file.text().then(txt=>{const rows=txt.trim().split(/\r?\n/).slice(1).map(l=>l.split(',')).filter(c=>c.length>=4&&!isNaN(+c[3])&&!isNaN(Date.parse(c[0]))).map(c=>({date:new Date(c[0]),channel:c[1].trim(),product:c[2].trim(),amount:+c[3]}));if(!rows.length)return alert('No valid rows found. Expected: date,channel,product,amount');data=rows;$('range').value='365';chanOpts();render()})};
$('range').onchange=$('chan').onchange=render;addEventListener('resize',render);chanOpts();render();
</script></body></html>
